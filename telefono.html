<!doctype html>
<html lang="es" translate="no">
  <head>
    <meta charset="UTF-8" />
    <title>La web en teléfono (sólo dev)</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- SÓLO DEV (no entra en el build): el simulador de la web (cuentas.html) dentro de un marco de teléfono, para juzgar
         tamaños de toque y alcance del pulgar.  http://localhost:<puerto>/telefono.html?demo=regalo
         …?ir=<lo que va después de cuentas.html?, codificado>  abre cualquier caso del simulador. -->
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; gap: 14px; padding: 18px 12px 26px; background: #0B0A1A; color: #E9E6FF; font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .barra { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; max-width: 820px; }
      .barra button { height: 34px; padding: 0 14px; border-radius: 999px; border: 1px solid rgba(255,255,255,.14); background: rgba(255,255,255,.06); color: inherit; font: inherit; font-weight: 700; cursor: pointer; }
      .barra button[aria-pressed="true"] { background: #6C47FF; border-color: #6C47FF; }
      .telefono { width: 414px; max-width: 100%; padding: 12px; border-radius: 54px; background: #1B1930; box-shadow: 0 30px 80px -30px #000, inset 0 0 0 2px rgba(255,255,255,.08); }
      .telefono iframe { display: block; width: 390px; max-width: 100%; height: min(844px, calc(100vh - 150px)); border: 0; border-radius: 42px; background: #fff; }
      small { color: #A7A1D6; text-align: center; max-width: 560px; }
    </style>
  </head>
  <body>
    <div class="barra" id="barra"></div>
    <div class="telefono"><iframe id="marco" title="La web en teléfono"></iframe></div>
    <small id="nota">Demo con gente y cifras de EJEMPLO (nada se guarda). El marco mide 390 px de ancho, como un teléfono.</small>
    <script>
      // «Invitar con regalo»: la consultora (sin cuenta) y la Directora (Mi unidad)
      const CASOS = [
        ['Regalo: con pedidos', 'registro=regalo&ir=/regalo/demo'],
        ['Regalo: sin pedidos', 'registro=regalo&ir=/regalo/demo-sin'],
        ['Ya tiene cuenta', 'registro=regalo&ir=/regalo/demo-cuenta'],
        ['Entra con su sesión', 'plan=gratis-consultora&ir=/regalo/demo-mia'],
        ['Ya lo activó', 'registro=regalo&ir=/regalo/demo-activa'],
        ['Directora sin plan', 'registro=regalo&ir=/regalo/demo-cerrada'],
        ['Directora: Mi unidad', 'plan=elite&ir=/my-unit'],
      ]
      const params = new URLSearchParams(location.search)
      const marco = document.getElementById('marco'), barra = document.getElementById('barra')
      const abrir = query => {
        marco.src = '/cuentas.html?' + query
        barra.querySelectorAll('button[data-q]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.q === query)))
      }
      CASOS.forEach(([nombre, query]) => { const b = document.createElement('button'); b.textContent = nombre; b.dataset.q = query; b.onclick = () => abrir(query); barra.appendChild(b) })
      const recargar = document.createElement('button'); recargar.textContent = '↻ Recargar'; recargar.onclick = () => { sessionStorage.clear(); marco.src = marco.src }; barra.appendChild(recargar)
      abrir(params.get('ir') || CASOS[0][1])
    </script>
  </body>
</html>
